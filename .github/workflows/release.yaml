name: Release

# release-please maintains a release PR from conventional commits on main.
# Merging it creates a DRAFT GitHub release, which triggers the
# supply-chain-hardened publish below:
#   - multi-arch image, pushed by digest, with BuildKit SBOM + provenance
#   - keyless cosign signatures (GitHub OIDC) for image AND chart
#   - SLSA build-provenance + SBOM attestations via the GitHub attestation API
#     (auto-skipped while the repo is private — the API refuses user-owned
#     private repos; they resume the moment the repo goes public)
#   - SBOM, shim, and packaged chart attached while the release is still a
#     draft; `publish-release` then flips it public, which is the point
#     GitHub release immutability freezes the tag and its assets
# Verify (see SECURITY.md): gh attestation verify / cosign verify.

on:
  push:
    branches:
      - main
  # Manual trigger for the normal flow (e.g. the first release, or to refresh
  # the release PR without a new commit). Recovery from a failed publish leg is
  # GitHub's native "Re-run failed jobs": it keeps the run's commit SHA and
  # re-runs publish-release once the leg passes, finishing the still-draft
  # release — no bespoke resume path needed.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      # JSON blob of the open release PR (number, headBranchName, …);
      # empty when no PR was created/updated on this run.
      pr: ${{ steps.release.outputs.pr }}
      # Commit the publish jobs build from. release-please creates the release
      # as a DRAFT (release-please-config.json), so its tag ref does not exist
      # until `publish-release` flips it public — the jobs cannot check out the
      # tag. This run's SHA is the merged release PR, which already carries
      # release-please's version bumps, so it is what the new tag will point at.
      sha: ${{ github.sha }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  pr-gate:
    name: Dispatch CI onto the release PR
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: release-please
    # A release PR was created or rebased (not merged): its head is exactly
    # what the next tag will contain, so every required check has to report on
    # that head — and none of them will on their own. release-please pushes
    # the branch with GITHUB_TOKEN, and GitHub fires no pull_request/push
    # workflow for a GITHUB_TOKEN push (recursion guard). workflow_dispatch is
    # the documented exception, and a dispatched run's check-runs and statuses
    # land on the head SHA of the dispatched ref — which is the PR head.
    #
    # So dispatch ci.yaml onto the release branch: the four check-runs
    # (Go build + test, golangci-lint, Generated code up to date, Helm chart).
    # Without this they could not be required on main at all: they would never
    # appear on the release PR, and a required check that never reports blocks
    # the merge forever.
    #
    # e2e is deliberately NOT dispatched here. Every push to main rebases the
    # release PR, so auto-dispatch meant the full kind matrix ran on every
    # commit — the exact cost the gate design was meant to avoid. Instead this
    # job marks the new head's `e2e` status pending (which keeps the merge
    # blocked while `e2e` is a required status check) and a maintainer runs
    # the suite once, when the PR is actually about to be merged, by
    # commenting `/e2e` on it (see e2e.yaml). The e2e run then reports
    # success/failure onto the same SHA.
    if: needs.release-please.outputs.pr != ''
    permissions:
      contents: read
      pull-requests: read # resolve the PR head SHA
      actions: write      # gh workflow run
      statuses: write     # pending `e2e` status on the PR head
    steps:
      - name: Mark e2e pending and dispatch CI
        env:
          GH_TOKEN: ${{ github.token }}
          PR_JSON: ${{ needs.release-please.outputs.pr }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          branch=$(jq -r .headBranchName <<<"$PR_JSON")
          number=$(jq -r .number <<<"$PR_JSON")
          sha=$(gh pr view "$number" --repo "$REPO" --json headRefOid --jq .headRefOid)
          gh api "repos/$REPO/statuses/$sha" \
            -f state=pending -f context=e2e \
            -f description="release gate — comment /e2e on the release PR to run" \
            -f target_url="$RUN_URL"
          gh workflow run ci.yaml --repo "$REPO" --ref "$branch"

  publish-image:
    name: Publish container image (signed, attested)
    runs-on: ubuntu-24.04
    # Multi-arch: the linux/arm64 leg is emulated under QEMU and dominates.
    timeout-minutes: 30
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    permissions:
      contents: write     # upload release assets
      packages: write     # push to GHCR
      id-token: write     # keyless signing (OIDC)
      attestations: write # GitHub attestation API
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build + push (multi-arch, SBOM + provenance embedded)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ needs.release-please.outputs.tag-name }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.release-please.outputs.tag-name }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.release-please.outputs.tag-name }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Sign image (cosign, keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"

      - name: Attest build provenance (SLSA)
        # The GitHub attestation API refuses user-owned PRIVATE repos
        # ("Feature not available…make this repository public"). Skip all
        # attest steps while private — they resume untouched once the repo is
        # public. cosign signing is unaffected either way.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: SBOM of released image (SPDX)
        uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-image.spdx.json
          upload-artifact: false

      - name: Attest SBOM
        if: ${{ !github.event.repository.private }} # see: Attest build provenance
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-image.spdx.json
          push-to-registry: true

      - name: Attest the SBOM file itself (release asset)
        # The step above binds the SBOM to the image digest. This binds it to
        # its own sha256 as a *file*, which is what someone who downloads the
        # release asset can actually check:
        #   gh attestation verify sbom-image.spdx.json --repo <owner>/<repo>
        if: ${{ !github.event.repository.private }} # see: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sbom-image.spdx.json

      - name: Sign SBOM file (cosign sign-blob, keyless)
        # The attest step above binds the SBOM in GitHub's attestation store;
        # this drops a detached signature *next to the asset* so a downloader
        # (and Scorecard's Signed-Releases check) can verify from the release
        # alone. Keyless: identity is this workflow's OIDC token, logged in
        # Rekor — no key to store. Verify:
        #   cosign verify-blob --signature sbom-image.spdx.json.sig \
        #     --certificate sbom-image.spdx.json.pem \
        #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
        #     --certificate-identity-regexp '^https://github.com/${{ github.repository }}/\.github/workflows/release\.yaml@' \
        #     sbom-image.spdx.json
        run: |
          cosign sign-blob --yes \
            --output-signature sbom-image.spdx.json.sig \
            --output-certificate sbom-image.spdx.json.pem \
            sbom-image.spdx.json

      - name: Attach SBOM (+ signature) to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag-name }}" \
            sbom-image.spdx.json \
            sbom-image.spdx.json.sig sbom-image.spdx.json.pem --clobber

  publish-shim:
    name: Publish kpssh-shim (attested)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    permissions:
      contents: write     # upload release assets
      id-token: write     # keyless signing (OIDC)
      attestations: write # GitHub attestation API
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Checksum
        # The shim is the one artifact users install by hand, as root, on every
        # host in the pool — and it is the gate the whole verified-exec design
        # rests on. Shipping it as a versioned, attested asset means an operator
        # can pin it to a release and prove what they fetched; "copy it out of
        # the repo" gives them a file with no provenance at all.
        run: sha256sum kpssh-shim > kpssh-shim.sha256
        working-directory: shim

      - name: Attest shim provenance (SLSA)
        # By path, exactly like the SBOM and chart assets: binds the file's own
        # sha256 to this workflow's OIDC identity, so
        #   gh attestation verify kpssh-shim --repo <owner>/<repo>
        # holds even if someone later overwrites the release asset.
        # Skipped while the repo is private — the attestation API refuses
        # user-owned private repos (see publish-image).
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: shim/kpssh-shim

      - name: Sign shim (cosign sign-blob, keyless)
        # The shim is installed by hand as root on every host — the asset most
        # worth a detached signature. Keyless, same as the image/chart. Verify:
        #   cosign verify-blob --signature kpssh-shim.sig \
        #     --certificate kpssh-shim.pem \
        #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
        #     --certificate-identity-regexp '^https://github.com/${{ github.repository }}/\.github/workflows/release\.yaml@' \
        #     kpssh-shim
        working-directory: shim
        run: |
          cosign sign-blob --yes \
            --output-signature kpssh-shim.sig \
            --output-certificate kpssh-shim.pem \
            kpssh-shim

      - name: Attach shim + checksum (+ signature) to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag-name }}" \
            shim/kpssh-shim shim/kpssh-shim.sha256 \
            shim/kpssh-shim.sig shim/kpssh-shim.pem --clobber

  publish-chart:
    name: Publish helm chart (signed, attested)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Set up Go (helm-docs)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Regenerate chart README at the released version
        # release-please bumps Chart.yaml via x-release-please markers but
        # cannot regenerate the helm-docs README (the install snippet) —
        # refresh it here so the packaged chart ships current docs.
        # Via the Makefile so this pin cannot skew from ci.yaml's drift check.
        run: make helm-docs

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GHCR (docker config)
        # `helm registry login` below only writes helm's own registry config.
        # cosign resolves the pushed chart via the *docker* credential chain,
        # so while the package is private it gets an anonymous 401 without
        # this. Harmless once public; required until then.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Package + push to GHCR OCI
        id: push
        run: |
          echo "${{ github.token }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/karpenter-provider-ssh
          OUT=$(helm push karpenter-provider-ssh-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts 2>&1)
          echo "$OUT"
          echo "digest=$(echo "$OUT" | sed -n 's/^Digest: //p')" >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign, keyless)
        run: |
          cosign sign --yes \
            "ghcr.io/${{ github.repository_owner }}/charts/karpenter-provider-ssh@${{ steps.push.outputs.digest }}"

      - name: Attest chart provenance (SLSA)
        # Skipped while the repo is private — the attestation API refuses
        # user-owned private repos (see publish-image).
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/charts/karpenter-provider-ssh
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest packaged chart (release asset)
        # The step above attests the OCI manifest pushed to GHCR. The .tgz
        # attached to the GitHub release is a different artifact with a
        # different digest — attest it by path, or `helm pull`-from-release
        # users have nothing to verify against:
        #   gh attestation verify karpenter-provider-ssh-X.Y.Z.tgz --repo <owner>/<repo>
        if: ${{ !github.event.repository.private }} # see: Attest chart provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: karpenter-provider-ssh-*.tgz

      - name: Sign chart archive (cosign sign-blob, keyless)
        # cosign signs the OCI chart above; this signs the .tgz release asset
        # (a different artifact) so a `helm pull`-from-release user can verify
        # keyless. Verify (resolve the exact name first):
        #   cosign verify-blob --signature karpenter-provider-ssh-X.Y.Z.tgz.sig \
        #     --certificate karpenter-provider-ssh-X.Y.Z.tgz.pem \
        #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
        #     --certificate-identity-regexp '^https://github.com/${{ github.repository }}/\.github/workflows/release\.yaml@' \
        #     karpenter-provider-ssh-X.Y.Z.tgz
        run: |
          tgz=$(ls karpenter-provider-ssh-*.tgz)
          cosign sign-blob --yes \
            --output-signature "${tgz}.sig" \
            --output-certificate "${tgz}.pem" \
            "$tgz"

      - name: Attach packaged chart (+ signature) to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag-name }}" \
            karpenter-provider-ssh-*.tgz \
            karpenter-provider-ssh-*.tgz.sig karpenter-provider-ssh-*.tgz.pem --clobber

  publish-release:
    name: Publish the release (draft → public)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Every asset is attached to the draft by the jobs above. Flipping it
    # public is the instant immutability freezes the release — the tag ref is
    # created and the assets can no longer change. Do it last, and only when
    # all three publish legs succeeded: a failed leg then leaves a resumable
    # draft (GitHub's "Re-run failed jobs") instead of a half-filled release
    # that immutability would lock in its broken state.
    needs: [release-please, publish-image, publish-shim, publish-chart]
    if: needs.release-please.outputs.release-created == 'true'
    permissions:
      contents: write # publish the release + create its tag
    steps:
      - name: Flip draft to public
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag-name }}
          REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --repo "$REPO" --draft=false
