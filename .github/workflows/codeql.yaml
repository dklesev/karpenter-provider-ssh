name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "43 5 * * 2"

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs on PR pushes; never cancel main/scheduled runs.
  group: codeql-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (Go + Actions)
    # Code-scanning upload needs GitHub Advanced Security on private repos —
    # skips until the repository goes public (free there).
    if: ${{ !github.event.repository.private && (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [go, actions]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:${{ matrix.language }}"
