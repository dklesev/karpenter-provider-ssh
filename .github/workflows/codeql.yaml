name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "43 5 * * 2"

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs on PR pushes; never cancel main/scheduled runs.
  group: codeql-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (Go + Actions)
    # Code-scanning upload needs GitHub Advanced Security on private repos —
    # skips until the repository goes public (free there).
    if: ${{ !github.event.repository.private && (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # build-mode is per-language: Go rejects `none` (needs autobuild or
        # manual); `actions` only supports `none`. A shared build-mode fails
        # one leg or the other.
        include:
          - language: go
            build-mode: autobuild
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
