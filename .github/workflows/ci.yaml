name: CI

# These four jobs are the required status checks on main. Feature PRs report
# them via `pull_request`; the release-please PR cannot, and that asymmetry is
# the whole reason release.yaml has a gate job:
#
# release-please pushes its branch with GITHUB_TOKEN, and GitHub fires no
# `pull_request` (or `push`) workflow for a GITHUB_TOKEN push — the recursion
# guard. So the release PR's head carries none of these contexts on its own,
# and a required check that never reports blocks a merge forever. Requiring
# them would deadlock the release PR; not requiring them means a PR with red
# unit tests is mergeable as far as branch protection is concerned.
#
# workflow_dispatch is the documented exception to the recursion guard, and a
# dispatched run's check-runs attach to the head SHA of the dispatched ref —
# which IS the release PR's head SHA. release.yaml's `pr-gate` job therefore
# dispatches this workflow onto the release branch, which is what makes
# `Go build + test`, `golangci-lint`, `Generated code up to date` and
# `Helm chart` requirable on main without deadlocking the release PR.
# (e2e is not auto-dispatched — it runs once, on a maintainer's `/e2e`
# comment on the release PR; see e2e.yaml.)

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs on PR pushes; never cancel main builds.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  go:
    name: Go build + test
    # Inert today (see the header: the release PR fires no pull_request
    # events). It only prevents a duplicate run alongside the dispatched one
    # if the release PR is ever raised with a PAT/App token.
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: integration tests (envtest)
        run: make test-integration

      - name: go build
        run: go build ./...

  lint:
    name: golangci-lint
    # See the `go` job.
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Must be built with Go >= the go.mod version, else it hard-errors
          # ("Go language version used to build golangci-lint is lower than the
          # targeted Go version"). v2.13.2 is built with go1.27. Bump in lockstep
          # with the go directive — dependabot does not track this input.
          version: v2.13.2

      - name: shellcheck (shipped shell)
        # ubuntu-24.04 runners ship shellcheck. Files and severity live in the
        # Makefile so `make lint-shell` locally is byte-for-byte this check.
        run: make lint-shell

      - name: actionlint (workflows)
        # The workflows gate the release and mint the signing identity — lint
        # them like code. Pinned in the Makefile (`go run …@vX`), so CI and a
        # local `make lint-actions` cannot drift apart. actionlint also runs
        # shellcheck over every inline `run:` block.
        run: make lint-actions

  codegen:
    name: Generated code up to date
    # See the `go` job.
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Regenerate deepcopy + CRDs
        run: make generate manifests

      - name: Refresh vendored karpenter core CRDs
        # Copies from the pinned module. A dependabot bump of
        # sigs.k8s.io/karpenter would otherwise leave config/karpenter/ stale
        # with nothing to catch it, and `make install` would apply CRDs older
        # than the core compiled into the binary.
        run: make karpenter-crds

      - name: Regenerate chart README (helm-docs)
        # Without this the chart README silently drifts from values.yaml:
        # release.yaml regenerates it into the packaged tarball but never back
        # into the repo, so the rendered docs on the default branch rot.
        # Same pin as release.yaml — both go through the Makefile.
        run: make helm-docs

      - name: Verify no drift
        run: |
          if ! git diff --exit-code; then
            echo "::error::generated code / CRDs / chart README out of date — run 'make verify' and commit"
            exit 1
          fi

      - name: Verify license headers
        run: make verify-license

      - name: Verify docs links
        # Here rather than in docs.yaml: that one only runs on push to main and
        # exists to publish the site, so it would report rot after it shipped.
        # This job is already the repo's self-consistency check (drift, license
        # headers) and runs on every PR, which is where a dead link is still
        # cheap to fix.
        run: make lint-docs

  helm:
    name: Helm chart
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: helm lint
        run: helm lint charts/karpenter-provider-ssh

      - name: helm template (defaults)
        run: helm template smoke charts/karpenter-provider-ssh -n kpssh-system >/dev/null

      - name: helm template (coexistence-style overrides)
        run: |
          helm template smoke charts/karpenter-provider-ssh -n kpssh-system \
            --set poolNamespace=pool-inventory \
            --set serviceMonitor.enabled=true \
            --set-json 'imagePullSecrets=[{"name":"ghcr-pull"}]' \
            --set-json 'nodeSelector={"kubernetes.io/hostname":"mi-smoke"}' >/dev/null

      - name: Chart CRDs in sync with config/crd
        run: diff -r config/crd charts/karpenter-provider-ssh/crds

  # The image build itself is validated by security.yaml's image-scan job
  # (syft/grype need a built image anyway) — no separate build-only job here.
  # The `e2e` required-status exemption for feature PRs lives in
  # e2e-exempt.yaml (pull_request_target — fork PRs get a read-only token
  # under plain pull_request, which cannot write commit statuses).
