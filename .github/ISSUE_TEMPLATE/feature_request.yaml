name: Feature request
description: New capability (join profile, provisioner, broker, …)
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: API sketch welcome (CRD fields, profile contract, values)
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
