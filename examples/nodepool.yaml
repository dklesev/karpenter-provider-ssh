# Karpenter NodePool over the SSH host pool. Limits should reflect the real
# pool capacity — karpenter treats them as a provisioning ceiling.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: pool
spec:
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 60s
  template:
    metadata:
      labels:
        karpenter.dklesev.github.io/managed: "true"
    spec:
      nodeClassRef:
        group: karpenter.dklesev.github.io
        kind: SSHNodeClass
        name: pool
      expireAfter: Never          # hosts are long-lived; no forced node rotation
      # Optional: hold every non-tolerating pod off the node until the
      # matching SSHNodeClass startupTaintGate opens (docs/concepts.md).
      # startupTaints:
      #   - key: example.com/agent-not-ready
      #     effect: NoExecute
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
  limits:
    cpu: "8"
    memory: 12Gi
