# Generic kubelet TLS-bootstrap profile — works against any conformant control
# plane (verified: k0s, Exoscale SKS, kind). Includes the field fixes that make
# repeated join/leave cycles clean: resolvConf detection, shim kill, mount
# cleanup, CNI device deletion.
apiVersion: karpenter.dklesev.github.io/v1beta1
kind: SSHJoinProfile
metadata:
  name: tls-bootstrap
spec:
  version: "1"
  scripts:
    install: |
      #!/usr/bin/env bash
      set -euxo pipefail
      export DEBIAN_FRONTEND=noninteractive
      K8S_MINOR="${KPSSH_VAR_k8sMinor:?k8sMinor var required}"

      mkdir -p /var/lib/kpssh

      cat > /etc/modules-load.d/k8s.conf <<EOF
      overlay
      br_netfilter
      EOF
      modprobe overlay || true
      modprobe br_netfilter || true
      cat > /etc/sysctl.d/99-k8s.conf <<EOF
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
      EOF
      sysctl --system >/dev/null

      apt-get update -q
      apt-get install -y -q containerd conntrack socat ebtables ethtool

      mkdir -p /etc/containerd
      containerd config default > /etc/containerd/config.toml
      sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
      systemctl enable --now containerd
      systemctl restart containerd

      mkdir -p /etc/apt/keyrings
      curl -fsSL "https://pkgs.k8s.io/core:/stable:/v${K8S_MINOR}/deb/Release.key" \
        | gpg --dearmor --yes -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v${K8S_MINOR}/deb/ /" \
        > /etc/apt/sources.list.d/kubernetes.list
      apt-get update -q
      apt-get install -y -q kubelet kubernetes-cni
      apt-mark hold kubelet
      systemctl disable --now kubelet || true

      touch /var/lib/kpssh/installed
      echo "kpssh install: OK"

    join: |
      #!/usr/bin/env bash
      set -euxo pipefail
      : "${KPSSH_CLUSTER_ENDPOINT:?}" "${KPSSH_CLUSTER_CA_B64:?}" "${KPSSH_BOOTSTRAP_TOKEN:?}" "${KPSSH_NODE_NAME:?}"
      CLUSTER_DNS="${KPSSH_VAR_clusterDNS:-10.96.0.10}"
      SERVER_TLS="${KPSSH_VAR_serverTLSBootstrap:-false}"

      systemctl stop kubelet 2>/dev/null || true
      rm -f /etc/kubernetes/kubelet.conf /etc/kubernetes/bootstrap-kubelet.conf
      rm -rf /var/lib/kubelet/pki

      mkdir -p /etc/kubernetes/pki /etc/kubernetes/manifests /var/lib/kpssh
      echo "${KPSSH_CLUSTER_CA_B64}" | base64 -d > /etc/kubernetes/pki/ca.crt

      cat > /etc/kubernetes/bootstrap-kubelet.conf <<EOF
      apiVersion: v1
      kind: Config
      clusters:
      - cluster:
          certificate-authority: /etc/kubernetes/pki/ca.crt
          server: ${KPSSH_CLUSTER_ENDPOINT}
        name: default
      contexts:
      - context: {cluster: default, user: bootstrap}
        name: bootstrap
      current-context: bootstrap
      users:
      - name: bootstrap
        user:
          token: ${KPSSH_BOOTSTRAP_TOKEN}
      EOF
      chmod 600 /etc/kubernetes/bootstrap-kubelet.conf

      cat > /etc/kubernetes/kubelet-config.yaml <<EOF
      apiVersion: kubelet.config.k8s.io/v1beta1
      kind: KubeletConfiguration
      authentication:
        anonymous: {enabled: false}
        webhook: {enabled: true}
        x509: {clientCAFile: /etc/kubernetes/pki/ca.crt}
      authorization: {mode: Webhook}
      cgroupDriver: systemd
      clusterDNS: ["${CLUSTER_DNS}"]
      clusterDomain: cluster.local
      containerRuntimeEndpoint: unix:///run/containerd/containerd.sock
      rotateCertificates: true
      serverTLSBootstrap: ${SERVER_TLS}
      staticPodPath: /etc/kubernetes/manifests
      failSwapOn: false
      EOF
      if [ -f /run/systemd/resolve/resolv.conf ]; then
        echo 'resolvConf: /run/systemd/resolve/resolv.conf' >> /etc/kubernetes/kubelet-config.yaml
      fi

      EXTRA_ARGS="--hostname-override=${KPSSH_NODE_NAME}"
      [ -n "${KPSSH_NODE_ADDRESS:-}" ] && EXTRA_ARGS="${EXTRA_ARGS} --node-ip=${KPSSH_NODE_ADDRESS}"
      [ -n "${KPSSH_PROVIDER_ID:-}" ] && EXTRA_ARGS="${EXTRA_ARGS} --provider-id=${KPSSH_PROVIDER_ID}"
      [ -n "${KPSSH_NODE_LABELS:-}" ] && EXTRA_ARGS="${EXTRA_ARGS} --node-labels=${KPSSH_NODE_LABELS}"
      [ -n "${KPSSH_TAINTS:-}" ] && EXTRA_ARGS="${EXTRA_ARGS} --register-with-taints=${KPSSH_TAINTS}"

      # 90-: drop-ins apply in filename order across /usr/lib and /etc, and a
      # kubeadm package (if the host has one) ships 10-kubeadm.conf with its
      # own ExecStart= — ours must sort after it or kubeadm's wins.
      mkdir -p /etc/systemd/system/kubelet.service.d
      rm -f /etc/systemd/system/kubelet.service.d/10-kpssh.conf
      cat > /etc/systemd/system/kubelet.service.d/90-kpssh.conf <<EOF
      [Service]
      ExecStart=
      ExecStart=/usr/bin/kubelet --config=/etc/kubernetes/kubelet-config.yaml --bootstrap-kubeconfig=/etc/kubernetes/bootstrap-kubelet.conf --kubeconfig=/etc/kubernetes/kubelet.conf ${EXTRA_ARGS}
      EOF

      systemctl daemon-reload
      systemctl enable --now containerd
      systemctl enable --now kubelet
      systemctl restart kubelet

      for i in $(seq 1 60); do
        [ -s /etc/kubernetes/kubelet.conf ] && { echo "kpssh join: OK"; exit 0; }
        sleep 2
      done
      echo "kpssh join: TLS bootstrap did not complete" >&2
      journalctl -u kubelet --no-pager -n 50 >&2 || true
      exit 1

    leave: |
      #!/usr/bin/env bash
      # Disable, not just stop, both units: a rebooted warm-pool host must stay
      # out of the cluster until the next claim. join re-enables them.
      set -euxo pipefail
      systemctl disable --now kubelet 2>/dev/null || true

      systemctl disable --now containerd 2>/dev/null || true
      pkill -9 -f containerd-shim 2>/dev/null || true
      sleep 1

      awk '$2 ~ /^\/var\/lib\/kubelet/ {print $2}' /proc/mounts | sort -r | xargs -r -n1 umount -f 2>/dev/null || true

      rm -f /etc/kubernetes/kubelet.conf /etc/kubernetes/bootstrap-kubelet.conf
      rm -rf /var/lib/kubelet/pki /var/lib/kubelet/pods
      rm -rf /etc/cni/net.d/*

      for dev in kube-bridge kube-dummy-if cni0 flannel.1; do
        ip link del "$dev" 2>/dev/null || true
      done

      echo "kpssh leave: OK (units disabled — reboot-safe)"

    uninstall: |
      #!/usr/bin/env bash
      set -euxo pipefail
      systemctl disable --now kubelet 2>/dev/null || true
      apt-mark unhold kubelet || true
      export DEBIAN_FRONTEND=noninteractive
      apt-get purge -y -q kubelet kubernetes-cni || true
      rm -rf /etc/kubernetes /var/lib/kubelet /etc/cni /opt/cni /var/lib/kpssh
      rm -f /etc/systemd/system/kubelet.service.d/90-kpssh.conf /etc/systemd/system/kubelet.service.d/10-kpssh.conf
      systemctl daemon-reload
      echo "kpssh uninstall: OK"
