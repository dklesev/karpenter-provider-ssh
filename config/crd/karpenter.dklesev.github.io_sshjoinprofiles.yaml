---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: sshjoinprofiles.karpenter.dklesev.github.io
spec:
  group: karpenter.dklesev.github.io
  names:
    categories:
    - karpenter
    kind: SSHJoinProfile
    listKind: SSHJoinProfileList
    plural: sshjoinprofiles
    shortNames:
    - sjp
    singular: sshjoinprofile
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: SSHJoinProfile is a named, versioned set of install/join/leave/uninstall
          scripts.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SSHJoinProfileSpec defines a pluggable join mechanism.
            properties:
              scripts:
                description: |-
                  ProfileScripts holds the four lifecycle phase scripts. Each is a Go
                  text/template rendered with the join context and executed on the host via
                  `sudo bash` with KPSSH_* env injected. All scripts MUST be idempotent.
                properties:
                  install:
                    description: |-
                      Install prepares a blank host (heavy, once per host, cached via
                      SSHHost.status.installedProfile).
                    maxLength: 262144
                    type: string
                  join:
                    description: Join connects the host to the cluster (fast, every
                      claim).
                    maxLength: 262144
                    type: string
                  leave:
                    description: |-
                      Leave disconnects the host, keeps installed components (fast, every
                      release). Rendered with an empty context — the release path and the
                      zombie guard both run it without a node class in hand, so it must not
                      reference .Vars or .Secrets (the nodeclass controller rejects profiles
                      that do).
                    maxLength: 262144
                    type: string
                  uninstall:
                    description: Uninstall fully cleans the host. Manual/repair only.
                    maxLength: 262144
                    type: string
                required:
                - install
                - join
                - leave
                type: object
              signatures:
                description: |-
                  Signatures are the per-phase SSHSIG signatures over the scripts, required
                  when a Verified-mode host runs a phase. Scripts must be template-free in
                  that case (the signed bytes must equal the executed bytes); all per-node
                  variability arrives as KPSSH_* params instead.
                properties:
                  install:
                    description: Install is the SSHSIG over spec.scripts.install.
                    maxLength: 16384
                    type: string
                  join:
                    description: Join is the SSHSIG over spec.scripts.join.
                    maxLength: 16384
                    type: string
                  leave:
                    description: Leave is the SSHSIG over spec.scripts.leave.
                    maxLength: 16384
                    type: string
                  uninstall:
                    description: Uninstall is the SSHSIG over spec.scripts.uninstall.
                    maxLength: 16384
                    type: string
                type: object
              timeouts:
                description: Timeouts overrides the per-phase script deadlines.
                properties:
                  install:
                    description: Install bounds the install script (default 10m).
                    pattern: ^([0-9]+(s|m|h))+$
                    type: string
                  join:
                    description: Join bounds the join script (default 5m).
                    pattern: ^([0-9]+(s|m|h))+$
                    type: string
                  leave:
                    description: Leave bounds the leave script (default 3m).
                    pattern: ^([0-9]+(s|m|h))+$
                    type: string
                type: object
              version:
                default: "1"
                description: Version invalidates the install cache when bumped ("<name>@<version>").
                pattern: ^[A-Za-z0-9._-]{1,63}$
                type: string
            required:
            - scripts
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
