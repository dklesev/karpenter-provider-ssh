# Default values for karpenter-provider-ssh.
#
# The controller embeds karpenter core: do NOT install the upstream karpenter
# chart alongside it for the same NodePools. Coexistence with a foreign
# karpenter (e.g. AWS) in the same cluster is supported — see
# docs/coexistence.md. karpenter.sh CRDs (NodePool/NodeClaim/NodeOverlay) are
# intentionally NOT shipped by this chart; on greenfield clusters install them
# once from the pinned module (`make install` / config/karpenter/).

# -- Number of controller replicas. Leader election is enabled, but >1 only
# buys faster failover — the pool claim lock is CAS-based either way.
replicas: 1

image:
  # -- Controller image repository.
  repository: ghcr.io/dklesev/karpenter-provider-ssh
  # -- Image tag. Defaults to `v<Chart.appVersion>`.
  tag: ""
  # -- Image digest. Takes precedence over tag when set.
  digest: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Pull secrets for the controller image (only needed with a private
# mirror), e.g. `[{name: ghcr-pull}]`.
imagePullSecrets: []

# -- Override the chart name.
nameOverride: ""
# -- Override the fully qualified release name.
fullnameOverride: ""

serviceAccount:
  # -- Create the ServiceAccount.
  create: true
  # -- ServiceAccount name. Defaults to the fullname.
  name: ""
  # -- Extra annotations for the ServiceAccount.
  annotations: {}

rbac:
  # -- Create ClusterRole/Roles and bindings. The rules are scoped: cluster-wide
  # reads for scheduling state, writes only on karpenter.sh + kpssh APIs and
  # Nodes, namespaced Roles for pool secrets, leader-election leases and
  # bootstrap-token minting (kube-system).
  create: true
  # -- Additional ClusterRole rules (escape hatch for custom join profiles that
  # need more API access).
  extraRules: []

# -- Namespace holding SSHHost inventory, the SSH key Secret and join Secrets.
# Defaults to the release namespace. If set to a different namespace, that
# namespace must already exist.
poolNamespace: ""

settings:
  # -- Controller log level (debug, info, error).
  logLevel: info
  # -- How long karpenter batches pending pods before provisioning
  # (BATCH_MAX_DURATION).
  batchMaxDuration: 10s
  # -- Idle gap that closes a batch early (BATCH_IDLE_DURATION).
  batchIdleDuration: 1s

controller:
  # -- Extra environment variables for the controller container.
  env: []
  # -- Container resources. Requests only by default; the controller is a
  # single Go binary and needs no limits to behave.
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
  # -- Metrics port (karpenter core registry + controller-runtime).
  metricsPort: 8080
  # -- Health/readiness probe port.
  healthProbePort: 8081

# -- Extra annotations for the controller Pod.
podAnnotations: {}
# -- Extra labels for the controller Pod.
podLabels: {}

# -- Pod-level security context (restricted-PSS compliant).
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context (restricted-PSS compliant).
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# -- PriorityClass for the controller. The provider is cluster infrastructure:
# losing it stops scale-up AND scale-down of the pool.
priorityClassName: system-cluster-critical

# -- Node selector for the controller Pod. The controller needs SSH reach to
# every pool host — schedule it accordingly.
nodeSelector:
  kubernetes.io/os: linux

# -- Tolerations for the controller Pod.
tolerations: []

# -- Affinity. The default forbids scheduling onto nodes this provider itself
# manages — consolidation would otherwise evict its own controller.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: karpenter.dklesev.github.io/managed
              operator: DoesNotExist

# -- Topology spread constraints for the controller Pod.
topologySpreadConstraints: []

# -- Termination grace period. In-flight SSH phases finish or are retried by
# the next leader; scripts are idempotent by contract.
terminationGracePeriodSeconds: 30

podDisruptionBudget:
  # -- Create a PodDisruptionBudget. Only meaningful with `replicas` > 1
  # (leader failover); the chart refuses to render one at its floor
  # (`minAvailable` >= `replicas`), which would permanently block node drains.
  enabled: false
  # -- Minimum available controller pods. Integer only — must stay below
  # `replicas`; percentages are rejected.
  minAvailable: 1

service:
  # -- Create a ClusterIP Service for the metrics port.
  enabled: true
  # -- Extra annotations for the metrics Service.
  annotations: {}

serviceMonitor:
  # -- Create a Prometheus Operator ServiceMonitor.
  enabled: false
  # -- Extra labels so your Prometheus instance selects the monitor.
  additionalLabels: {}
  # -- Scrape interval.
  interval: 30s
  # -- Metric relabelings.
  metricRelabelings: []

networkPolicy:
  # -- Create a NetworkPolicy for the controller Pod. Egress is allow-listed to
  # the API server, DNS and the SSH pool; ingress to the metrics/health ports.
  # This pod holds the pool SSH key and mints bootstrap tokens — the policy
  # bounds what a compromised controller can reach. Needs a policy-enforcing
  # CNI (Calico, Cilium, …); with any other CNI it is silently inert.
  enabled: false
  # -- CIDRs the controller may open SSH connections to. Empty means *any*
  # destination (0.0.0.0/0) on `sshPort` — set your pool subnets, e.g.
  # `["10.0.0.0/16"]`.
  sshEgressCIDRs: []
  # -- SSH port allowed on egress. Must cover `SSHHost.spec.port` for every
  # host in the pool; for a mixed-port pool add the rest via `extraEgress`.
  sshPort: 22
  # -- TCP ports the API server answers on. 443 covers EKS and the in-cluster
  # `kubernetes.default` ClusterIP; 6443 covers kubeadm/k0s-style endpoints.
  apiServerPorts: [443, 6443]
  # -- CIDRs the API server endpoints live in. Empty means any destination on
  # `apiServerPorts` — narrow it when the endpoint IPs are stable.
  apiServerCIDRs: []
  # -- Ingress peers allowed to scrape the metrics port (verbatim NetworkPolicy
  # peers). Empty means any source, e.g. `[{namespaceSelector: {matchLabels:
  # {kubernetes.io/metadata.name: monitoring}}}]`. The health port stays open to
  # all sources regardless — kubelet probes come from the node IP, which no
  # pod/namespace selector can match.
  metricsFrom: []
  # -- Extra egress rules, appended verbatim (HTTP proxy, SSH bastion, a
  # second SSH port, …).
  extraEgress: []
