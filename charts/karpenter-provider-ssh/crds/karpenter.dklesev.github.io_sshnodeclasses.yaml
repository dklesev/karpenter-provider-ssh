---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: sshnodeclasses.karpenter.dklesev.github.io
spec:
  group: karpenter.dklesev.github.io
  names:
    categories:
    - karpenter
    kind: SSHNodeClass
    listKind: SSHNodeClassList
    plural: sshnodeclasses
    shortNames:
    - snc
    singular: sshnodeclass
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.joinProfileRef.name
      name: Profile
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: SSHNodeClass is the karpenter node class for pool-backed nodes.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              SSHNodeClassSpec configures how NodeClaims of this class turn pool hosts
              into nodes.
            properties:
              cluster:
                description: |-
                  Cluster overrides endpoint/CA discovery. When empty, both are read
                  from the kube-public/cluster-info ConfigMap (standard TLS-bootstrap
                  discovery), which is correct when the provider runs in the cluster it
                  joins nodes to.
                properties:
                  caBundle:
                    description: |-
                      CABundle is the cluster CA certificate (PEM), base64-encoded on the wire
                      like every other Kubernetes byte field (webhook clientConfig, APIService).
                    format: byte
                    maxLength: 65536
                    type: string
                  endpoint:
                    description: Endpoint is the API server URL, e.g. https://10.0.0.5:6443.
                    maxLength: 253
                    pattern: ^https://.+$
                    type: string
                required:
                - endpoint
                type: object
              hostSelector:
                description: |-
                  HostSelector limits which SSHHosts may be claimed. Empty = all hosts
                  in the provider namespace.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              joinProfileRef:
                description: JoinProfileRef names the SSHJoinProfile used for hosts
                  of this class.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: joinProfileRef.name must not be empty
                  rule: self.name != ''
              joinSecretRef:
                description: |-
                  JoinSecretRef names a Secret in the pool namespace whose data keys are
                  injected into join scripts as KPSSH_SECRET_<UPPERCASED_KEY> env vars.
                  Generic credential material passing (e.g. EKS SSM activation id/code);
                  the provider only reads the Secret — its lifecycle is out of scope.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: joinSecretRef.name must not be empty
                  rule: self.name != ''
              kubeReserved:
                additionalProperties:
                  anyOf:
                  - type: integer
                  - type: string
                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                  x-kubernetes-int-or-string: true
                description: |-
                  KubeReserved overrides the kubelet overhead modeled per instance type
                  (default: 80m CPU, 300Mi memory). Advertised to karpenter only — align
                  the kubelet's --kube-reserved via the join profile.
                type: object
                x-kubernetes-validations:
                - message: kubeReserved keys must be cpu, memory or ephemeral-storage
                  rule: self.all(k, k in ['cpu','memory','ephemeral-storage'])
              maxPods:
                description: |-
                  MaxPods overrides the pods capacity advertised per instance type
                  (default: 110). Advertised to karpenter only — align the kubelet's
                  maxPods via the join profile.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              pricePerCPUHour:
                default: "0.02"
                description: |-
                  PricePerCPUHour models the cost of an attached vCPU-hour (EKS hybrid:
                  0.02). Drives karpenter's cost-aware decisions. Unit: USD, string form.
                pattern: ^[0-9]+(\.[0-9]+)?$
                type: string
              providerIDSource:
                default: Static
                description: |-
                  ProviderIDSource: Static (provider decides kpssh://…, passed via
                  --provider-id) or Adopt (join mechanism owns node identity, e.g. EKS
                  nodeadm; provider copies the Node's providerID).
                enum:
                - Static
                - Adopt
                type: string
              vars:
                additionalProperties:
                  type: string
                description: |-
                  Vars are profile template variables (e.g. k8sMinor, clusterDNS). Keys
                  become KPSSH_VAR_<key> environment variables in the scripts and must be
                  valid shell identifiers.
                maxProperties: 64
                type: object
                x-kubernetes-validations:
                - message: vars keys must be valid shell identifiers ([A-Za-z_][A-Za-z0-9_]*)
                  rule: self.all(k, k.matches('^[A-Za-z_][A-Za-z0-9_]*$'))
                - message: vars values must be at most 2048 characters
                  rule: self.all(k, size(self[k]) <= 2048)
            required:
            - joinProfileRef
            type: object
          status:
            description: SSHNodeClassStatus reports readiness.
            properties:
              conditions:
                description: |-
                  Conditions carries the Ready condition set by the nodeclass controller
                  (profile exists and parses, selector matches at least one host).
                items:
                  description: Condition aliases the upstream type and adds additional
                    helper methods
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
